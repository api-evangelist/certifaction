aid: certifaction
name: Certifaction
description: >-
  Certifaction is a privacy-first digital signature platform built around a Zero
  Document Knowledge model: documents are hashed and end-to-end encrypted on the
  client so they can be signed and verified without Certifaction ever seeing their
  content. It offers Simple, Advanced, and Qualified Electronic Signatures
  (SES/AES/QES) compliant with eIDAS, ZertES, UETA and ESIGN, delivered through a
  client-hosted CLI and Local API plus an Admin API for organization, user, role
  and team-space management, with EU / Switzerland / on-premises data residency
  and ISO/IEC 27001:2022 certification.
